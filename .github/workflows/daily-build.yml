name: Update DNS Rules

# 触发条件：每天国际标准时间 04:00 (北京时间中午 12:00) 或手动点击触发
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予写权限以便提交生成的列表

    steps:
      # 1. 检出你自己的仓库代码
      - name: Checkout own repo
        uses: actions/checkout@v4

      # 2. 检出 v2fly 官方仓库代码到 upstream 文件夹
      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: upstream

      # 3. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 4. 运行转换脚本
      - name: Run conversion script
        run: python3 scripts/convert.py

      # 5. 提交变更回本仓库
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Sync with v2fly upstream"
          file_pattern: "cn-direct.txt"
