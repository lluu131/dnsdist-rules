name: Update China Domain List

on:
  schedule:
    # 每天北京时间 4:00 AM 运行 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout codebase
      uses: actions/checkout@v3

    - name: Download and Process Data
      run: |
        echo "正在下载上游数据..."
        # 下载 felixonmars 的列表
        curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf -o raw.conf
        
        echo "正在预处理数据..."
        # 使用 sed 命令进行清洗：
        # 1. ^server=/ 删除行首的 server=/
        # 2. /114.114.114.114$ 删除行尾的 IP（注意：上游IP可能变，这里用更通用的正则）
        # 逻辑：匹配 / 之间的内容
        sed -n 's|^server=/\(.*\)/.*$|\1|p' raw.conf > china_domains.txt
        
        # 删除临时文件
        rm raw.conf
        
        # 统计行数
        echo "处理完成，共提取 $(wc -l < china_domains.txt) 个域名。"

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 检查是否有文件变化
        if [[ -n $(git status -s) ]]; then
          git add china_domains.txt
          git commit -m "Auto-update: $(date +'%Y-%m-%d') domain list"
          git push origin main
        else
          echo "No changes found."
        fi
